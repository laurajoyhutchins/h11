name: Verify Git-backed contract evidence reuse across branches

on:
  push:
    branches: [research/synthetic-history-evidence]
    paths:
      - .github/workflows/contract-evidence-index.yml
      - research/contract_poset/evidence_index.py
      - research/contract_poset/test_evidence_index.py
      - research/contract_poset/poset.py
      - research/contract_poset/h11_claim_links.json
      - research/contract_history/contracts.json
      - research/contract_verify/h11_verified_summary.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test real scratch Git branches and conservative evidence invalidation
        run: |
          PYTHONPATH=research/contract_poset python -m unittest -v test_poset test_evidence_index
      - name: Inspect existing Git refs and independent changes, no target remote writes
        shell: bash
        run: |
          set -euo pipefail
          original=62c5068c971579d61fa1b55373390e12f25fd856
          git worktree add --detach "$RUNNER_TEMP/original" "$original"
          python research/contract_discovery/discover_v2.py \
            "$RUNNER_TEMP/original" --package h11 --tests h11/tests \
            --output "$RUNNER_TEMP/discovery.json"
          python research/contract_poset/evidence_index.py . \
            --discovery "$RUNNER_TEMP/discovery.json" \
            --contracts research/contract_history/contracts.json \
            --links research/contract_poset/h11_claim_links.json \
            --verified research/contract_verify/h11_verified_summary.json \
            --ref "$original" \
            --ref e8d9391373d3ae3234abe4fe24d2ad0bc8116a81 \
            --ref HEAD \
            --output "$RUNNER_TEMP/existing-refs.json"

          git clone -q --shared . "$RUNNER_TEMP/branches"
          cd "$RUNNER_TEMP/branches"
          git config user.email evidence-fixture@example.invalid
          git config user.name EvidenceFixture

          git switch -q -c documentation "$original"
          printf 'Independent evidence note\n' > extra-evidence.txt
          git add extra-evidence.txt
          git commit -qm "fixture: add evidence without source mutation"
          docref="$(git rev-parse HEAD)"

          git switch -q -c reader-change "$original"
          python - <<'PY'
          from pathlib import Path
          p=Path("h11/_readers.py")
          old='self._bytes_in_chunk = int(matches["chunk_size"], base=16)'
          s=p.read_text()
          assert s.count(old)==1
          p.write_text(s.replace(old,old+" + 1"))
          PY
          git add h11/_readers.py
          git commit -qm "fixture: modify reader chunk length behavior"
          readerref="$(git rev-parse HEAD)"

          git switch -q -c writer-change "$original"
          python - <<'PY'
          from pathlib import Path
          p=Path("h11/_writers.py")
          old='write(b"0\\r\\n")'
          s=p.read_text()
          assert s.count(old)==1
          p.write_text(s.replace(old,'write(b"1\\r\\n")'))
          PY
          git add h11/_writers.py
          git commit -qm "fixture: modify writer terminal chunk behavior"
          writerref="$(git rev-parse HEAD)"

          git switch -q -c joined-reader-writer "$readerref"
          git merge --no-ff -q -m "fixture: two-parent branch integration" "$writerref"
          joinedref="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n 1 "$joinedref" | wc -w)" -eq 3

          cd "$GITHUB_WORKSPACE"
          python research/contract_poset/evidence_index.py "$RUNNER_TEMP/branches" \
            --discovery "$RUNNER_TEMP/discovery.json" \
            --contracts research/contract_history/contracts.json \
            --links research/contract_poset/h11_claim_links.json \
            --verified research/contract_verify/h11_verified_summary.json \
            --ref "$original" \
            --ref "$docref" \
            --ref "$readerref" \
            --ref "$writerref" \
            --ref "$joinedref" \
            --output "$RUNNER_TEMP/independent-branches.json"

          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          current=json.loads((root/"existing-refs.json").read_text())
          real=json.loads((root/"independent-branches.json").read_text())
          assert len(current["revisions"])==3
          assert all(ref["reuse_eligible"]==3 for ref in current["revisions"])
          assert len({r["tree_oid"] for r in current["revisions"]})==2

          base, docs, reader, writer, merge=real["revisions"]
          def status(ref):
              return {claim["claim"]:claim["status"] for claim in ref["claims"]}
          allowed="REUSE_ELIGIBLE"
          denied="REVERIFY_REQUIRED"
          assert all(s==allowed for s in status(base).values())
          assert all(s==allowed for s in status(docs).values())
          assert status(reader)=={
              "http1.chunked.reader":denied,
              "http1.chunked.writer":allowed,
              "http1.chunked.composition":denied,
          },reader
          assert status(writer)=={
              "http1.chunked.reader":allowed,
              "http1.chunked.writer":denied,
              "http1.chunked.composition":denied,
          },writer
          assert all(s==denied for s in status(merge).values())
          assert len(merge["parent_oids"])==2
          for ref in (reader,writer,merge):
              assert any("SOURCE_BLOB_CHANGED" in claim["reasons"]
                         for claim in ref["claims"])
          print("REAL_EXISTING_REFS",json.dumps([
              {"ref":r["ref"],"eligible":r["reuse_eligible"],
               "reverify":r["reverify_required"]} for r in current["revisions"]],sort_keys=True))
          print("BRANCH_FIXTURE_MATRIX",json.dumps([
              {"commit":r["commit_oid"],"status":status(r),
               "two_parent_merge":len(r["parent_oids"])==2}
              for r in real["revisions"]],sort_keys=True))
          digest=hashlib.sha256((root/"independent-branches.json").read_bytes()).hexdigest()
          print("FULL_BRANCH_EVIDENCE_SHA256",digest)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Git Merkle refs: conservative contract evidence reuse\n\n")
              out.write("| Revision | Reader | Writer | Composition |\n| --- | --- | --- | --- |\n")
              for name,ref in zip(("base","docs only","reader changed",
                                   "writer changed","two-parent merge"),real["revisions"]):
                  outcomes=status(ref)
                  out.write("| "+name+" | "+" | ".join(
                      outcomes[c] for c in ("http1.chunked.reader",
                                            "http1.chunked.writer",
                                            "http1.chunked.composition"))+" |\n")
              out.write("\nAll original, synthetic-final, and research HEAD source closures are byte-identical.\n\n")
              out.write("Only source-identity *eligibility* is claimed, not fresh or whole-program verification.\n\n")
              out.write("Full scratch-branch result SHA-256: "+digest+".\n")
          PY
          test -z "$(git -C "$RUNNER_TEMP/branches" status --porcelain)"
          test -z "$(git -C "$RUNNER_TEMP/original" status --porcelain)"
          test "$(git -C "$RUNNER_TEMP/original" rev-parse HEAD^{tree})" = \
            5a1cacdb9d0d6e8d18e8161924ae18130da6c130
