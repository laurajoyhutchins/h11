name: Verify Git-object contract poset projection

on:
  push:
    branches: [research/synthetic-history-evidence]
    paths:
      - .github/workflows/contract-poset.yml
      - research/contract_poset/**
      - research/contract_discovery/discover.py
      - research/contract_discovery/discover_v2.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poset:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit-test lattice identities and explicit semantic boundaries
        run: PYTHONPATH=research/contract_poset python -m unittest -v test_poset
      - name: Project existing Git objects onto module and claim partial orders
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/source" 62c5068c971579d61fa1b55373390e12f25fd856
          python research/contract_discovery/discover_v2.py "$RUNNER_TEMP/source" \
            --package h11 --tests h11/tests --output "$RUNNER_TEMP/discovery.json"
          python research/contract_poset/poset.py . \
            --discovery "$RUNNER_TEMP/discovery.json" \
            --stages research/contract_history/generated_commits.json \
            --contracts research/contract_history/contracts.json \
            --links research/contract_poset/h11_claim_links.json \
            --verified research/contract_verify/h11_verified_summary.json \
            --output "$RUNNER_TEMP/poset.json"
          python - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"poset.json"
          raw=p.read_bytes()
          result=json.loads(raw)
          modules=result["structural_module_poset"]
          claims=result["explicit_semantic_claim_poset"]
          stages={r["stage"]:r for r in result["existing_git_stage_projection"]}
          assert len(modules["nodes"]) == 11
          assert modules["count_exact"] is True
          assert modules["number_of_order_ideals"] > 0
          assert claims["number_of_claim_order_ideals"] == 5
          assert len(claims["claims"]) == 3
          assert all(x["reported_status"]=="VERIFIED_WITHIN_SCOPE" for x in claims["claims"])
          assert all(r["downward_closed_imports"] for r in stages.values())
          reader=stages["chunked-reader"]
          writer=stages["chunked-writer"]
          composition=stages["codec-composition"]
          foundation=stages["foundation"]
          assert set(reader["modules"]) & set(writer["modules"]) == set(foundation["modules"])
          assert set(reader["modules"]) | set(writer["modules"]) == set(composition["modules"])
          assert composition["merge_source_union_equals_child_modules"] is True
          assert composition["merge_meet_of_module_ideals"] == foundation["modules"]
          assert composition["stage_parent_names"] == ["chunked-reader","chunked-writer"]
          assert foundation["external_original_commit_anchor"]
          assert stages["complete"]["tree_oid"] == result["source"]["tree"]
          assert stages["complete"]["modules"] == [n["id"] for n in modules["nodes"]]
          assert len(stages)==6
          assert claims["stage_claim_projection"]["codec-composition"]["semantic_claim_frontier"] == ["http1.chunked.composition"]
          print("MODULES",len(modules["nodes"]))
          print("ORDER_IDEALS",modules["number_of_order_ideals"])
          print("MODULE_COVER_EDGES",len(modules["cover_edges"]))
          print("STAGE_MODULES",json.dumps({k:len(v["modules"]) for k,v in stages.items()},sort_keys=True))
          print("READER_WRITER_MEET",len(composition["merge_meet_of_module_ideals"]))
          print("READER_WRITER_JOIN",len(composition["merge_join_of_module_ideals"]))
          print("CLAIM_ORDER_IDEALS",claims["number_of_claim_order_ideals"])
          print("CLAIM_COVER_EDGES",json.dumps(claims["claim_cover_edges"],sort_keys=True))
          print("EXISTING_GIT_TREE",result["source"]["tree"])
          digest=hashlib.sha256(raw).hexdigest()
          print("FULL_POSET_JSON_SHA256",digest)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Git-object-backed partial-order projection\n\n")
              out.write(f"Source modules: **{len(modules['nodes'])}**; exact module order ideals: **{modules['number_of_order_ideals']}**.\n\n")
              out.write(f"Existing Git checkpoints checked: **{len(stages)}**; all are dependency-closed import slices.\n\n")
              out.write("Reader and writer branches meet at the foundation and join at codec composition.\n\n")
              out.write("Explicit semantic claims: **3**, five possible dependency-closed claim sets, with earlier external evidence attached.\n\n")
              out.write("Git ancestry and source import edges are not automatically contract implications.\n\n")
              out.write(f"Full report SHA-256: {digest}.\n")
          PY
          test -z "$(git -C "$RUNNER_TEMP/source" status --porcelain)"
          test "$(git -C "$RUNNER_TEMP/source" rev-parse HEAD^{tree})" = \
            5a1cacdb9d0d6e8d18e8161924ae18130da6c130
