name: Contract preservation under writer transformation

on:
  push:
    branches: [research/contract-preservation]
    paths:
      - .github/workflows/contract-preservation.yml
      - research/preservation/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check-finite-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      PRIOR_RUN: "42667731213"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact prior evidence test environment
        run: python -m pip install 'pytest==9.2.0'
      - name: Read existing authenticated in-toto evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN" > "$RUNNER_TEMP/trusted-run.json"
          gh run download "$PRIOR_RUN" --repo "$GITHUB_REPOSITORY" \
            --name native-contract-evidence --dir "$RUNNER_TEMP/previous"
      - name: Unit-test evidence and AST proof obligations
        run: |
          PYTHONPATH=research/preservation python -m unittest \
            discover -s research/preservation -p 'test_*.py' -v
      - name: Make local Git rewrite, replay real h11, and check downstream preservation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preservation"
          python research/preservation/run.py \
            --source . \
            --work "$RUNNER_TEMP/preservation" \
            --prior-artifacts "$RUNNER_TEMP/previous" \
            --trusted-run "$RUNNER_TEMP/trusted-run.json"
      - name: Save independently inspectable witness and proof obligations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-contract-preservation
          path: |
            ${{ runner.temp }}/preservation/baseline-observations.json
            ${{ runner.temp }}/preservation/candidate-observations.json
            ${{ runner.temp }}/preservation/mutant-observations.json
            ${{ runner.temp }}/preservation/preservation.json
            ${{ runner.temp }}/preservation/preservation.intoto.json
            ${{ runner.temp }}/preservation/candidate.patch
            ${{ runner.temp }}/preservation/prior-reference.json
          if-no-files-found: warn
          retention-days: 30
