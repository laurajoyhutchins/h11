name: Held-out Git evidence reuse falsification

on:
  push:
    branches: [research/native-contract-ci-evidence]
    paths:
      - research/ci_evidence/heldout.py
      - research/ci_evidence/test_heldout.py
      - .github/workflows/native-evidence-heldout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test held-out comparator decisions
        run: PYTHONPATH=research/ci_evidence python -m unittest -v test_heldout
      - name: Execute held-out historical oracles and adversarial Git changes
        shell: bash
        run: |
          set -euo pipefail
          python research/ci_evidence/heldout.py \
            --protocol research/contract_poset/falsification_preregistration.json \
            --checkout-root "$RUNNER_TEMP/heldout-repos" \
            --history-count 20 \
            --output "$RUNNER_TEMP/heldout-observed.json"
      - name: Keep complete observations even on falsification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-source-reuse-observations
          path: ${{ runner.temp }}/heldout-observed.json
          if-no-files-found: warn
          retention-days: 30
